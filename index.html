<!doctype html>
<html class="dark" dir="rtl" lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" id="theme-color-meta" content="#072418" />
    <meta name="description" content="أحدث الأخبار، التغطيات، والانتقالات الخاصة بنادي الاتحاد السكندري زعيم الثغر.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="قناة الاتحاد">
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/icon.png?v=2" />
    <link rel="apple-touch-icon" href="/icon.png?v=2" />
    <script>
      (function() {
        var img = new Image();
        img.onerror = function() {
          var fallback = 'https://res.cloudinary.com/dqj6gzwfg/image/upload/v1777716805/favicon_gd0ic4.png';
          document.querySelector('link[rel="icon"]').href = fallback;
          document.querySelector('link[rel="apple-touch-icon"]').href = fallback;
        };
        img.src = '/icon.png?v=2';
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="image" href="https://res.cloudinary.com/dqj6gzwfg/image/fetch/f_auto,q_auto,w_800,c_limit/https%3A%2F%2Fimages.unsplash.com%2Fphoto-1574629810360-7efbbe195018%3Fq%3D80%26w%3D1000%26auto%3Dformat%26fit%3Dcrop" fetchpriority="high" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=swap" />
    <title>قناة الاتحاد السكندري</title>
    <!-- Google tag (gtag.js) -->
    <script async defer src="https://www.googletagmanager.com/gtag/js?id=G-XWSSXYDQN1"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-XWSSXYDQN1');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Force reload on chunk errors before the app even starts
      window.addEventListener('error', function(e) {
        if (e.message && (e.message.includes('ChunkLoadError') || e.message.includes('Loading chunk'))) {
          var lastReload = sessionStorage.getItem('last_chunk_reload');
          var now = Date.now();
          if (!lastReload || now - parseInt(lastReload) > 10000) { // 10s gap to avoid tight loops
            sessionStorage.setItem('last_chunk_reload', now);
            console.warn('Chunk error detected, reloading once...');
            window.location.reload();
          } else {
            console.error('Persistent chunk errors detected, reload suppressed.');
          }
        }
      }, true);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
